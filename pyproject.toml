[project]
name = "familybox"
# 版本唯一来源:src/Version.ini(改后手动同步此处)
version = "0.1.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "av>=18.1.0",
    "cryptography>=50.0.1",
    "pygame-ce>=2.5.7",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pillow>=12.3.0",
    "pyinstaller>=6.22.2",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[[tool.mypy.overrides]]
module = "cv2"
follow_imports = "silent"
ignore_missing_imports = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
